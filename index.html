<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HM TECH - Professional Oscilloscope</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="back-btn">❮</div>
    <div class="title">HM SCOPE</div>
    <div class="spacer"></div>
    
    <button id="btn-wifi-status" class="wifi-btn disconnected" onclick="toggleConnModal()">
      <span>DISCONNECTED</span>
    </button>
    
    <div class="status-badge" id="runState" onclick="toggleRunStop()" style="cursor:pointer;">RUN</div>
  </header>

  <div id="conn-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">CONNECTION</div>
      <div class="input-group">
        <label>Device IP (WebSocket)</label>
        <input type="text" id="esp-ip" value="192.168.4.1">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="toggleConnModal()">Cancel</button>
        <button id="btn-ws-connect" class="btn-connect" onclick="connectESP32()">Connect</button>
      </div>
    </div>
  </div>

  <main>
    <div class="display-container" id="canvasContainer">
      <canvas id="scopeCanvas"></canvas>
    </div>

    <div class="control-panel">
      <div class="hw-section ch1-sec">
        <div class="hw-header">CH 1 (X)</div>
        <div class="ctrl-row">
          <span class="ctrl-label">SCALE</span>
          <div class="adjust-group">
            <button class="adj-btn" onclick="adjustScale('ch1', -1)">-</button>
            <div class="adj-val" id="val-ch1-scale">5.0V</div>
            <button class="adj-btn" onclick="adjustScale('ch1', 1)">+</button>
          </div>
        </div>
        <div class="seg-group" id="seg-ch1-mode">
          <button class="seg-btn" onclick="setCoupling('ch1', 'DC')">DC</button>
          <button class="seg-btn active" onclick="setCoupling('ch1', 'AC')">AC</button>
          <button class="seg-btn" onclick="setCoupling('ch1', 'GND')">GND</button>
        </div>
      </div>

      <div class="hw-section ch2-sec">
        <div class="hw-header">CH 2 (Y)</div>
        <div class="ctrl-row">
          <span class="ctrl-label">SCALE</span>
          <div class="adjust-group">
            <button class="adj-btn" onclick="adjustScale('ch2', -1)">-</button>
            <div class="adj-val" id="val-ch2-scale">2.0V</div>
            <button class="adj-btn" onclick="adjustScale('ch2', 1)">+</button>
          </div>
        </div>
        <div class="seg-group" id="seg-ch2-mode">
          <button class="seg-btn active" onclick="setCoupling('ch2', 'DC')">DC</button>
          <button class="seg-btn" onclick="setCoupling('ch2', 'AC')">AC</button>
          <button class="seg-btn" onclick="setCoupling('ch2', 'GND')">GND</button>
        </div>
      </div>

      <div class="hw-section hor-sec">
        <div class="hw-header">HORIZONTAL</div>
        <div class="ctrl-row">
          <span class="ctrl-label">TIME</span>
          <div class="adjust-group">
            <button class="adj-btn" onclick="adjustTimebase(-1)">-</button>
            <div class="adj-val" id="val-timebase">10ms</div>
            <button class="adj-btn" onclick="adjustTimebase(1)">+</button>
          </div>
        </div>
        <div class="seg-group" id="seg-hor-mode">
          <button class="seg-btn active" onclick="setMode('YT')">Y-T</button>
          <button class="seg-btn" onclick="setMode('XY')">X-Y</button>
        </div>
      </div>

      <div class="hw-section trg-sec">
        <div class="hw-header">TRIGGER</div>
        <div class="ctrl-row">
          <span class="ctrl-label">SRC</span>
          <div class="seg-group" style="width: 100px;" id="seg-trg-src">
            <button class="seg-btn active" onclick="setTriggerSrc('CH1')">CH1</button>
            <button class="seg-btn" onclick="setTriggerSrc('CH2')">CH2</button>
          </div>
        </div>
        <div class="seg-group" id="seg-trg-mode">
          <button class="seg-btn active" onclick="setTriggerMode('AUTO')">AUTO</button>
          <button class="seg-btn" onclick="setTriggerMode('NORM')">NORM</button>
          <button class="seg-btn" onclick="setTriggerMode('SNGL')">SNGL</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/websocket.js"></script> <script src="js/renderer.js"></script>
</body>
</html>
